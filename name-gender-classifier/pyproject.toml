[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "namegender"
version = "0.1.0"
description = "A reproducible first-name gender classification project."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.6.1",
    "pandas==2.3.3",
    "numpy==2.4.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
namegender = "namegender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["namegender"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
